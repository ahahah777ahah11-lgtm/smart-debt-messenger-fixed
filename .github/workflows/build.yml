name: Build Smart Debt Messenger

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Upload web build for HTML-to-APK tools
        uses: actions/upload-artifact@v4
        with:
          name: smart-debt-messenger-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
